# Continuous integration.
#
# Why this exists: every quality property in this repository used to depend on a
# human choosing to run a command and believing the output. That produced a
# frontend build that had never once passed, 337 backend typecheck errors with
# no ESLint config at all, and a skipped test suite that documentation claimed
# was
# green. CI turns "someone checked" into "the repository checks itself".
#
# What is gated on every push to main and every pull request:
#
#   backend (timeline/)                     frontend (frontend/)
#   ------------------------------------    ------------------------------------
#   npm ci                                  npm ci
#   npx tsc --noEmit                        npx tsc -b --noEmit --force
#   npm run lint   (--max-warnings 0)       npx eslint .   (errors only)
#   npx vitest --run --coverage             npx vitest --run --coverage
#                                           npm run build
#
# The two lint gates are deliberately NOT symmetric. The backend's script
# carries --max-warnings 0, so any warning fails it. The frontend's does not:
# it has
# eight pre-existing react-hooks/exhaustive-deps warnings (six effects missing a
# dependency, two dependency-array entries that are complex expressions). At
# least the D3-driving ones -- Timeline.tsx, ActorTimeline.tsx,
# PressureIndicators.tsx -- are intentionally unfixed: putting the referenced
# callbacks and values back into those dependency arrays re-runs the D3 effects
# that write into an SVG subtree React does not own, which is how this
# repository's infinite update loops were produced
# (impl/deferredplans/ADR-001-d3-react-integration.md documents the callback-ref
# pattern that replaced them), and silencing them with eslint-disable is
# forbidden by impl/gap-remediation/README.md. So frontend *errors* fail the
# gate and frontend warnings are printed but do not; the header used to claim
# "--max-warnings 0" here, which was never true.
#
# Coverage runs in the same step as the tests, report-only. Neither package sets
# a coverage threshold (impl/gap-remediation/phase6-results.md records why), so
# @vitest/coverage-v8 has no number to fail on: the step reddens only if the
# suite itself fails. Folding it into the test step keeps one run per package
# while exercising both vitest.config.ts coverage blocks, and the documented
# baseline, on a clean machine rather than only on the author's.
#
# The frontend production build is explicitly gated because it is the single
# highest-value regression lock: it had never passed before, so a green build is
# real evidence, not a formality.
#
# The two packages are independent and each saturates a machine's CPUs, so they
# run as separate parallel jobs on separate runners rather than sequentially.
# Both suites run in local execution mode with no external services (no Neo4j,
# no Redis), so no service containers are required.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: timeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # No "engines" field is declared. Vite 7 requires
          # ^20.19.0 || >=22.12.0
          # and Vitest 3 requires ^18 || ^20 || >=22; the dev machine and
          # the lockfiles are Node 24, so 24 is the version the code is known to
          # work on.
          node-version: '24'
          cache: npm
          cache-dependency-path: timeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test (coverage report-only; no threshold is configured)
        run: npx vitest --run --coverage

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # See backend job: Node 24 matches the dev machine and satisfies the
          # Vite 7 / Vitest 3 engine constraints.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit --force

      - name: Lint
        # Errors only: see the header on the eight intentional
        # react-hooks/exhaustive-deps warnings.
        run: npx eslint .

      - name: Test (coverage report-only; no threshold is configured)
        run: npx vitest --run --coverage

      - name: Build
        run: npm run build

  e2e:
    name: E2E (real browser, stubbed API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Deliberately independent of backend/frontend: a failure here must not
    # gate them, and vice versa. The suite is hermetic (no services).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # See the backend job for why Node 24.
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install frontend dependencies (the preview server builds it)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        # The browser binary is not in the npm package; --with-deps adds the
        # system libraries a bare runner may lack. This is the one place the
        # browser download is actually needed.
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e (visual baselines excluded)
        # Screenshot baselines are platform-specific (see e2e/README.md), so the
        # portable functional flows run here and the @visual checks stay local.
        working-directory: e2e
        run: npx playwright test --grep-invert @visual
