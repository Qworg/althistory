# Continuous integration.
#
# Why this exists: every quality property in this repository used to depend on a
# human choosing to run a command and believing the output. That produced a
# frontend build that had never once passed, 337 backend typecheck errors with
# no ESLint config at all, and a skipped test suite that documentation claimed
# was
# green. CI turns "someone checked" into "the repository checks itself".
#
# What is gated on every push to main and every pull request:
#
#   backend (timeline/)                     frontend (frontend/)
#   ------------------------------------    ------------------------------------
#   npm ci                                  npm ci
#   npx tsc --noEmit                        npx tsc -b --noEmit --force
#   npm run lint   (--max-warnings 0)       npx eslint .   (errors only)
#   npx vitest --run --coverage             npx vitest --run --coverage
#                                           npm run build
#
#   cloud (timeline/)                       e2e (e2e/)
#   ------------------------------------    ------------------------------------
#   npm ci                                  npm ci
#   npm run test:cloud                      npx playwright test --grep-invert @visual
#
# The cloud job is the only one that starts services: a real Neo4j 5 and a
# real Redis, so the four suites that exercise the Neo4j path actually run
# against it. The e2e job is hermetic (no services).
#
# The two lint gates are deliberately NOT symmetric. The backend's script
# carries --max-warnings 0, so any warning fails it. The frontend's does not:
# it has
# eight pre-existing react-hooks/exhaustive-deps warnings (six effects missing a
# dependency, two dependency-array entries that are complex expressions). At
# least the D3-driving ones -- Timeline.tsx, ActorTimeline.tsx,
# PressureIndicators.tsx -- are intentionally unfixed: putting the referenced
# callbacks and values back into those dependency arrays re-runs the D3 effects
# that write into an SVG subtree React does not own, which is how this
# repository's infinite update loops were produced
# (impl/deferredplans/ADR-001-d3-react-integration.md documents the callback-ref
# pattern that replaced them), and silencing them with eslint-disable is
# forbidden by impl/gap-remediation/README.md. So frontend *errors* fail the
# gate and frontend warnings are printed but do not; the header used to claim
# "--max-warnings 0" here, which was never true.
#
# Coverage runs in the same step as the tests, report-only. Neither package sets
# a coverage threshold (impl/gap-remediation/phase6-results.md records why), so
# @vitest/coverage-v8 has no number to fail on: the step reddens only if the
# suite itself fails. Folding it into the test step keeps one run per package
# while exercising both vitest.config.ts coverage blocks, and the documented
# baseline, on a clean machine rather than only on the author's.
#
# The frontend production build is explicitly gated because it is the single
# highest-value regression lock: it had never passed before, so a green build is
# real evidence, not a formality.
#
# The two packages are independent and each saturates a machine's CPUs, so they
# run as separate parallel jobs on separate runners rather than sequentially.
# Both suites run in local execution mode, so they need no external services.
# The `cloud` job is the exception: it starts a real Neo4j and Redis, because
# the four suites that exercise the Neo4j path cannot be tested any other way.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: timeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # No "engines" field is declared. Vite 7 requires
          # ^20.19.0 || >=22.12.0
          # and Vitest 3 requires ^18 || ^20 || >=22; the dev machine and
          # the lockfiles are Node 24, so 24 is the version the code is known to
          # work on.
          node-version: '24'
          cache: npm
          cache-dependency-path: timeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test (coverage report-only; no threshold is configured)
        # The suite takes well under a minute. A step timeout, unlike the job
        # timeout, lets the job finish and keep its log, and the verbose and
        # hanging-process reporters name the file that stalls and any handle
        # that keeps vitest from exiting.
        timeout-minutes: 8
        run: npx vitest --run --coverage --reporter=verbose --reporter=hanging-process

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # See backend job: Node 24 matches the dev machine and satisfies the
          # Vite 7 / Vitest 3 engine constraints.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit --force

      - name: Lint
        # Errors only: see the header on the eight intentional
        # react-hooks/exhaustive-deps warnings.
        run: npx eslint .

      - name: Test (coverage report-only; no threshold is configured)
        run: npx vitest --run --coverage

      - name: Build
        run: npm run build

  cloud:
    name: Cloud integration (real Neo4j + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Independent of the other jobs for the same reason the e2e job is: a
    # failure here must not gate them, and vice versa.
    #
    # These four suites are the only ones that exercise the Neo4j path. They
    # are excluded from the default run because the services are not present on
    # a developer machine; here they are, as service containers.
    #
    # The suites fail outright if local execution is enabled (see
    # `timeline/src/test/cloud-guard.setup.ts`). That guard exists because the
    # suites used to run against the local JSON store and "pass" -- the local
    # store implements a Neo4j-shaped session, so a green run could mean
    # nothing at all.
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test_password_12345
          # APOC is not optional here: GraphCopyService copies nodes with
          # `apoc.create.node` / `apoc.map.setKey` and relationships with
          # `apoc.create.relationship`. Without the plugin those calls fail
          # with "Unknown procedure" and the copy reports an error. The compose
          # `neo4j` service installs it for the same reason.
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
          NEO4J_dbms_security_procedures_allowlist: apoc.*
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test_password_12345 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: timeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # See the backend job for why Node 24.
          node-version: '24'
          cache: npm
          cache-dependency-path: timeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cloud integration suites
        run: npm run test:cloud
        env:
          # Cloud mode: the suites must use the real driver, and the guard
          # fails the run if this is not the case.
          LOCAL_EXECUTION_ENABLED: 'false'
          # Both the plain and the _TEST_ variables are needed, and they are
          # the same set the compose `cloud-tests` service uses. The repository
          # suites read the _TEST_ ones; GraphCopyService goes through
          # `getDatabaseManager()`, which is configured from the plain ones.
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: test_password_12345
          # Community edition has no separate `test` database.
          NEO4J_DATABASE: neo4j
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USERNAME: neo4j
          NEO4J_TEST_PASSWORD: test_password_12345
          NEO4J_TEST_DATABASE: neo4j
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
          REDIS_TEST_HOST: localhost
          REDIS_TEST_PORT: '6379'
          REDIS_TEST_PASSWORD: ''

  e2e:
    name: E2E (real browser, stubbed API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Deliberately independent of backend/frontend: a failure here must not
    # gate them, and vice versa. The suite is hermetic (no services).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # See the backend job for why Node 24.
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install frontend dependencies (the preview server builds it)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        # The browser binary is not in the npm package; --with-deps adds the
        # system libraries a bare runner may lack. This is the one place the
        # browser download is actually needed.
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e (visual baselines excluded)
        # Screenshot baselines are platform-specific (see e2e/README.md), so the
        # portable functional flows run here and the @visual checks stay local.
        working-directory: e2e
        run: npx playwright test --grep-invert @visual
