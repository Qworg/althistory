# The GitHub Pages site (https://qworg.github.io/althistory/).
#
# `site/build.mjs` assembles it: the hand-written page in `site/src/`, the
# screenshots and video `media/` generates into `docs/`, the hero timeline
# drawn from the same seed history, and the in-browser demo at `demo/` (the
# real frontend built with `npm run build:demo`, which answers its own API from
# a recording of the real backend; see frontend/src/demo/). The demo's e2e
# suite runs against that build before anything is published. A pull request
# that touches any of those inputs builds and tests the site; only a push to
# main deploys.
#
# Pages must be set to deploy from GitHub Actions (Settings → Pages → Source).

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - 'docs/media/**'
      - 'media/src/seed/**'
      - 'frontend/**'
      # The app compiles the shared date package from source.
      - 'calendar/src/**'
      - 'e2e/demo/**'
      - 'e2e/playwright.demo.config.ts'
      - 'e2e/site/**'
      - 'e2e/playwright.site.config.ts'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/images/**'
      - 'docs/media/**'
      - 'media/src/seed/**'
      - 'frontend/**'
      # The app compiles the shared date package from source.
      - 'calendar/src/**'
      - 'e2e/demo/**'
      - 'e2e/playwright.demo.config.ts'
      - 'e2e/site/**'
      - 'e2e/playwright.site.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Node 24 also lets site/build.mjs import the TypeScript seed directly.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install e2e dependencies and Chromium
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e

      # The Playwright web server runs `npm run build:demo` itself, so the
      # build that is tested is the build that is published.
      - name: Build and test the demo
        run: npx playwright test -c playwright.demo.config.ts
        working-directory: e2e

      - name: Test the site's pages (contrast, overflow)
        run: npx playwright test -c playwright.site.config.ts
        working-directory: e2e

      - name: Assemble the site
        run: node site/build.mjs _site --demo frontend/dist-demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
