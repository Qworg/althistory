# The GitHub Pages site (https://qworg.github.io/althistory/).
#
# `site/build.mjs` assembles it: the hand-written page in `site/src/`, the
# screenshots and video `media/` generates into `docs/`, and the hero timeline
# drawn from the same seed history. A pull request that touches any of those
# builds the site so a broken build is caught; only a push to main deploys.
#
# Pages must be set to deploy from GitHub Actions (Settings → Pages → Source).

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - 'docs/media/**'
      - 'media/src/seed/**'
      - 'frontend/public/favicon.svg'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/images/**'
      - 'docs/media/**'
      - 'media/src/seed/**'
      - 'frontend/public/favicon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 imports the TypeScript seed directly; no install step needed.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node site/build.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
